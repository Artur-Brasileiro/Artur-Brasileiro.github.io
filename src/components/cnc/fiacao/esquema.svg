<svg viewBox="0 0 1220 820" role="img" aria-label="Esquema de ligações da CNC Plotter">
    <defs>
      <pattern id="cncf-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#efede6" stroke-width="1"/></pattern>
    </defs>
    <rect width="1220" height="820" fill="url(#cncf-grid)"/>

    <!-- ===================== COMPONENTES ===================== -->
    <!-- Fonte -->
    <g class="comp" data-g="p12" data-tip="Fonte chaveada 12 V / 5 A. Os dois fios de saída dela são pretos: confira a polaridade com o multímetro antes de ligar.">
      <rect x="40" y="55" width="170" height="70" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <text x="125" y="84" text-anchor="middle" class="lbl">Fonte 12 V · 5 A</text>
      <text x="125" y="102" text-anchor="middle" class="lbl-s">saída em plugue P4</text>
    </g>
    <!-- Divisor Y -->
    <g class="comp" data-g="p12" data-tip="Divisor Y P4: divide a saída da fonte em dois cabos. Como os dois lados saem da mesma fonte, o GND fica em comum para todo o sistema.">
      <circle cx="275" cy="90" r="13" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <text x="275" y="94" text-anchor="middle" class="mono">Y</text>
      <text x="275" y="122" text-anchor="middle" class="lbl-s">divisor Y P4</text>
    </g>
    <!-- Jack A -->
    <g class="comp" data-g="p12" data-tip="Jack P4 fêmea com borne (A): leva os 12 V para o CNC Shield.">
      <rect x="340" y="25" width="130" height="60" rx="7" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <text x="400" y="50" text-anchor="middle" class="lbl">Jack P4 (A)</text>
      <text x="400" y="67" text-anchor="middle" class="lbl-s">borne → shield</text>
      <text x="462" y="41" text-anchor="end" class="mono">−</text>
      <text x="462" y="70" text-anchor="end" class="mono">+</text>
    </g>
    <!-- Jack B -->
    <g class="comp" data-g="p12" data-tip="Jack P4 fêmea com borne (B): leva os 12 V para o módulo step-down que alimenta o servo.">
      <rect x="340" y="110" width="130" height="50" rx="7" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <text x="405" y="132" text-anchor="middle" class="lbl">Jack P4 (B)</text>
      <text x="405" y="148" text-anchor="middle" class="lbl-s">borne → step-down</text>
      <text x="395" y="174" text-anchor="middle" class="mono">+</text>
      <text x="435" y="174" text-anchor="middle" class="mono">−</text>
    </g>
    <!-- Buck -->
    <g class="comp" data-g="p5" data-tip="Módulo step-down 12 V → 5 V (18 × 12 mm). Alimenta só o servo. O servo NÃO pode ser ligado no 5 V do Arduino: o pico de corrente derruba o USB e reseta a placa no meio do desenho.">
      <rect x="360" y="230" width="140" height="70" rx="7" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <text x="430" y="261" text-anchor="middle" class="lbl">Step-down</text>
      <text x="430" y="278" text-anchor="middle" class="lbl-s">12 V → 5 V</text>
      <text x="395" y="244" text-anchor="middle" class="mono">IN+</text>
      <text x="438" y="244" text-anchor="middle" class="mono">IN−</text>
      <text x="492" y="259" text-anchor="end" class="mono">−</text>
      <text x="492" y="284" text-anchor="end" class="mono">+</text>
    </g>
    <!-- PC -->
    <g class="comp" data-g="usb" data-tip="PC com Windows rodando o LaserGRBL (COM, 115200 baud). O USB alimenta só a lógica do Arduino e faz a comunicação.">
      <rect x="700" y="40" width="180" height="80" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <text x="790" y="74" text-anchor="middle" class="lbl">PC · LaserGRBL</text>
      <text x="790" y="92" text-anchor="middle" class="lbl-s">115200 baud</text>
    </g>

    <!-- Arduino (atrás) + Shield -->
    <g class="comp" data-g="usb" data-tip="Arduino Uno com GRBL 1.1h (fork vankesteren/grbl-servo). Fica embaixo do CNC Shield, encaixado nos pinos.">
      <rect x="546" y="212" width="342" height="402" rx="10" fill="#eef4ff" stroke="#2563a8" stroke-width="1.4" stroke-dasharray="6 5"/>
      <text x="548" y="630" class="lbl-s" fill="#2563a8">Arduino Uno (embaixo do shield)</text>
    </g>
    <g class="comp" data-g="none" data-tip="CNC Shield V3 com drivers HR4988 (clones do A4988).">
      <rect x="560" y="200" width="340" height="392" rx="10" fill="#fff" stroke="#1d1d1f" stroke-width="1.8"/>
      <text x="575" y="290" class="lbl">CNC Shield V3</text>
      <text x="575" y="306" class="lbl-s">GRBL 1.1h + servo</text>
    </g>
    <!-- terminal 12V -->
    <g class="comp" data-g="p12" data-tip="Borne de alimentação do shield (12–36 V). + à esquerda, − à direita, conforme marcado na placa. Polaridade invertida queima os drivers.">
      <rect x="575" y="215" width="80" height="40" rx="5" fill="#e8f1ff" stroke="#2563a8"/>
      <circle cx="595" cy="235" r="8" fill="#fff" stroke="#1d1d1f"/><text x="595" y="239" text-anchor="middle" class="mono">+</text>
      <circle cx="635" cy="235" r="8" fill="#fff" stroke="#1d1d1f"/><text x="635" y="239" text-anchor="middle" class="mono">−</text>
      <text x="615" y="268" text-anchor="middle" class="lbl-s">12 V</text>
    </g>
    <!-- USB port -->
    <g class="comp" data-g="usb" data-tip="Porta USB do Arduino. Ao abrir a porta serial, o Uno reinicia: toda reconexão exige um novo $H.">
      <rect x="770" y="200" width="40" height="16" rx="3" fill="#d1d5db" stroke="#1d1d1f"/>
      <text x="790" y="230" text-anchor="middle" class="lbl-s">USB</text>
    </g>
    <!-- Drivers -->
    <g class="comp" data-g="mot" data-tip="Driver X (HR4988): eixo LONGO. 3 jumpers M0/M1/M2 fechados embaixo dele = micropasso 1/16 ($100=80). Vref medido ≈ 0,60 V (≈ 1,5 A).">
      <rect x="690" y="275" width="140" height="70" rx="6" fill="#f1f5f9" stroke="#1d1d1f"/>
      <text x="760" y="300" text-anchor="middle" class="lbl">Driver X</text>
      <text x="760" y="316" text-anchor="middle" class="lbl-s">eixo longo · 1/16</text>
      <g fill="#1d1d1f"><rect x="733" y="325" width="9" height="9" rx="1.5"/><rect x="747" y="325" width="9" height="9" rx="1.5"/><rect x="761" y="325" width="9" height="9" rx="1.5"/></g>
      <text x="778" y="333" class="lbl-s">M0 M1 M2</text>
    </g>
    <g class="comp" data-g="mot" data-tip="Driver Y (HR4988): eixo CURTO. 3 jumpers M0/M1/M2 fechados = 1/16 ($101=80).">
      <rect x="690" y="365" width="140" height="70" rx="6" fill="#f1f5f9" stroke="#1d1d1f"/>
      <text x="760" y="390" text-anchor="middle" class="lbl">Driver Y</text>
      <text x="760" y="406" text-anchor="middle" class="lbl-s">eixo curto · 1/16</text>
      <g fill="#1d1d1f"><rect x="733" y="415" width="9" height="9" rx="1.5"/><rect x="747" y="415" width="9" height="9" rx="1.5"/><rect x="761" y="415" width="9" height="9" rx="1.5"/></g>
      <text x="778" y="423" class="lbl-s">M0 M1 M2</text>
    </g>
    <g class="comp" data-g="none" data-tip="Slot Z: sem driver. A caneta é movida pelo servo no pino D11, não por motor de passo.">
      <rect x="690" y="455" width="140" height="44" rx="6" fill="#fafafa" stroke="#9ca3af" stroke-dasharray="4 4"/>
      <text x="760" y="482" text-anchor="middle" class="lbl-s">slot Z (vazio)</text>
    </g>
    <!-- motor headers -->
    <g class="comp" data-g="mot" data-tip="Saída do motor X (4 pinos: 2B 2A 1A 1B). Cada par (1A-1B, 2A-2B) é uma bobina do motor.">
      <rect x="860" y="282" width="20" height="58" rx="3" fill="#fff" stroke="#1d1d1f"/>
      <g class="mono" font-size="9"><text x="856" y="293" text-anchor="end">2B</text><text x="856" y="307" text-anchor="end">2A</text><text x="856" y="321" text-anchor="end">1A</text><text x="856" y="335" text-anchor="end">1B</text></g>
      <g fill="#1d1d1f"><circle cx="870" cy="290" r="3"/><circle cx="870" cy="304" r="3"/><circle cx="870" cy="318" r="3"/><circle cx="870" cy="332" r="3"/></g>
    </g>
    <g class="comp" data-g="mot" data-tip="Saída do motor Y (4 pinos: 2B 2A 1A 1B).">
      <rect x="860" y="372" width="20" height="58" rx="3" fill="#fff" stroke="#1d1d1f"/>
      <g class="mono" font-size="9"><text x="856" y="383" text-anchor="end">2B</text><text x="856" y="397" text-anchor="end">2A</text><text x="856" y="411" text-anchor="end">1A</text><text x="856" y="425" text-anchor="end">1B</text></g>
      <g fill="#1d1d1f"><circle cx="870" cy="380" r="3"/><circle cx="870" cy="394" r="3"/><circle cx="870" cy="408" r="3"/><circle cx="870" cy="422" r="3"/></g>
    </g>
    <!-- END STOPS header -->
    <g class="comp" data-g="end" data-tip="Conector END STOPS. Cada posição tem um pino de sinal (branco) e um de GND (preto). No GRBL, X− e X+ são o mesmo pino (D9), e Y− e Y+ também (D10). Z+ é usado pelo servo (D11).">
      <rect x="590" y="530" width="300" height="46" rx="6" fill="#fafaf7" stroke="#1d1d1f"/>
      <text x="598" y="525" class="lbl-s">END STOPS</text>
      <g class="mono" font-size="10" text-anchor="middle">
        <text x="615" y="545">X−</text><text x="665" y="545">X+</text><text x="715" y="545">Y−</text><text x="765" y="545">Y+</text><text x="815" y="545">Z−</text><text x="865" y="545">Z+</text>
      </g>
      <g stroke="#1d1d1f" stroke-width="1">
        <circle cx="606" cy="560" r="5" fill="#fff"/><circle cx="624" cy="560" r="5" fill="#1d1d1f"/>
        <circle cx="656" cy="560" r="5" fill="#fff"/><circle cx="674" cy="560" r="5" fill="#1d1d1f"/>
        <circle cx="706" cy="560" r="5" fill="#fff"/><circle cx="724" cy="560" r="5" fill="#1d1d1f"/>
        <circle cx="756" cy="560" r="5" fill="#fff"/><circle cx="774" cy="560" r="5" fill="#1d1d1f"/>
        <circle cx="806" cy="560" r="5" fill="#fff"/><circle cx="824" cy="560" r="5" fill="#1d1d1f"/>
        <circle cx="856" cy="560" r="5" fill="#fff"/><circle cx="874" cy="560" r="5" fill="#1d1d1f"/>
      </g>
    </g>

    <!-- Motores -->
    <g class="comp" data-g="mot" data-tip="Motor do eixo X (LONGO): NEMA 17 US-17HS4401S, 1,7 A/fase, ~1,5 Ω. Fica em cima da Base Principal e escala a correia parada (tração em ômega).">
      <rect x="1000" y="270" width="180" height="80" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <text x="1090" y="303" text-anchor="middle" class="lbl">Motor X · eixo longo</text>
      <text x="1090" y="321" text-anchor="middle" class="lbl-s">NEMA 17 · 17HS4401S</text>
    </g>
    <g class="comp" data-g="mot" data-tip="Motor do eixo Y (CURTO): NEMA 17 US-17HS4401S. Preso por baixo da Base Principal, com o eixo para cima.">
      <rect x="1000" y="360" width="180" height="80" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <text x="1090" y="393" text-anchor="middle" class="lbl">Motor Y · eixo curto</text>
      <text x="1090" y="411" text-anchor="middle" class="lbl-s">NEMA 17 · 17HS4401S</text>
    </g>
    <!-- Fins de curso -->
    <g class="comp" data-g="end" data-tip="Fim de curso X: microswitch com rolete, acionado com a ponte toda à direita (X+). COM no GND, NO no sinal (D9). $5=0.">
      <rect x="610" y="680" width="110" height="60" rx="7" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <g class="mono" font-size="9" text-anchor="middle"><text x="656" y="694">NO</text><text x="674" y="694">C</text><text x="694" y="694">NC</text></g>
      <text x="665" y="716" text-anchor="middle" class="lbl">Fim de curso X</text>
      <text x="665" y="731" text-anchor="middle" class="lbl-s">microswitch c/ rolete</text>
    </g>
    <g class="comp" data-g="end" data-tip="Fim de curso Y: embaixo da Base Principal, entre as barras de 6 mm, acionado pelo 'dedo' do carro (Y+). COM no GND, NO no sinal (D10).">
      <rect x="728" y="680" width="100" height="60" rx="7" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <g class="mono" font-size="9" text-anchor="middle"><text x="756" y="694">NO</text><text x="774" y="694">C</text><text x="794" y="694">NC</text></g>
      <text x="778" y="716" text-anchor="middle" class="lbl">Fim de curso Y</text>
      <text x="778" y="731" text-anchor="middle" class="lbl-s">microswitch</text>
    </g>
    <!-- Servo -->
    <g class="comp" data-g="srv" data-tip="Servo MG90S (ou SG90) que levanta a caneta. M5 = caneta em cima; M3 S220 = caneta embaixo. Cabo: marrom/preto = GND, vermelho = 5 V, amarelo/laranja = sinal.">
      <rect x="836" y="680" width="140" height="70" rx="8" fill="#fff" stroke="#1d1d1f" stroke-width="1.6"/>
      <text x="920" y="708" text-anchor="middle" class="lbl">Servo MG90S</text>
      <text x="920" y="724" text-anchor="middle" class="lbl-s">levanta a caneta</text>
      <g class="mono" font-size="9" text-anchor="middle"><text x="884" y="676">SINAL</text><text x="918" y="768">GND</text><text x="956" y="768">5V</text></g>
    </g>

    <!-- Legenda -->
    <g transform="translate(1000,470)">
      <rect width="190" height="186" rx="8" fill="#fff" stroke="#e2e0d8"/>
      <text x="14" y="24" class="lbl">Cores dos fios</text>
      <g class="lbl-s">
        <line x1="14" y1="42" x2="40" y2="42" stroke="var(--v12)" stroke-width="3"/><text x="48" y="46">+12 V</text>
        <line x1="14" y1="62" x2="40" y2="62" stroke="var(--gnd)" stroke-width="3"/><text x="48" y="66">GND (0 V)</text>
        <line x1="14" y1="82" x2="40" y2="82" stroke="var(--v5)" stroke-width="3"/><text x="48" y="86">+5 V (servo)</text>
        <line x1="14" y1="102" x2="40" y2="102" stroke="var(--sig)" stroke-width="3"/><text x="48" y="106">sinal PWM do servo</text>
        <line x1="14" y1="122" x2="40" y2="122" stroke="var(--c1)" stroke-width="3"/><text x="48" y="126">bobina 1 (1A/1B)</text>
        <line x1="14" y1="142" x2="40" y2="142" stroke="var(--c2)" stroke-width="3"/><text x="48" y="146">bobina 2 (2A/2B)</text>
        <line x1="14" y1="162" x2="40" y2="162" stroke="var(--end)" stroke-width="3"/><text x="48" y="166">sinal fim de curso</text>
      </g>
    </g>

    <!-- ===================== FIOS ===================== -->
    <!-- P4 -->
    <path class="w" data-g="p12" stroke="var(--p4)" stroke-width="7" d="M210 90 H262" data-tip="Cabo P4 da fonte (12 V)."/>
    <path class="w" data-g="p12" stroke="var(--p4)" stroke-width="7" d="M288 90 H310 V55 H340" data-tip="Cabo P4 → Jack A (shield)."/>
    <path class="w" data-g="p12" stroke="var(--p4)" stroke-width="7" d="M288 90 H310 V135 H340" data-tip="Cabo P4 → Jack B (step-down do servo)."/>
    <!-- Jack A -> shield -->
    <path class="w" data-g="p12" stroke="var(--gnd)" stroke-width="3" d="M470 45 H635 V227" data-tip="GND: borne − do Jack A → borne − do shield."/>
    <path class="w" data-g="p12" stroke="var(--v12)" stroke-width="3" d="M470 65 H595 V227" data-tip="+12 V: borne + do Jack A → borne + do shield."/>
    <!-- Jack B -> buck -->
    <path class="w" data-g="p12" stroke="var(--v12)" stroke-width="3" d="M395 160 V230" data-tip="+12 V: Jack B → IN+ do step-down."/>
    <path class="w" data-g="p12" stroke="var(--gnd)" stroke-width="3" d="M435 160 V230" data-tip="GND: Jack B → IN− do step-down. Fica em comum com o GND do shield porque os dois vêm da mesma fonte."/>
    <!-- buck -> servo -->
    <path class="w" data-g="p5" stroke="var(--gnd)" stroke-width="3" d="M500 255 H535 V775 H900 V750" data-tip="GND do servo (fio marrom/preto) ← OUT− do step-down."/>
    <path class="w" data-g="p5" stroke="var(--v5)" stroke-width="3" d="M500 280 H520 V790 H940 V750" data-tip="+5 V do servo (fio vermelho) ← OUT+ do step-down. Ajuste o trimpot do módulo para 5,0 V ANTES de ligar o servo."/>
    <!-- servo signal -->
    <path class="w" data-g="srv" stroke="var(--sig)" stroke-width="3" d="M856 565 V680" data-tip="Sinal do servo (fio amarelo/laranja) → Z+, pino BRANCO (D11, saída PWM do spindle no GRBL 1.1)."/>
    <!-- USB -->
    <path class="w" data-g="usb" stroke="var(--usb)" stroke-width="6" d="M790 120 V200" data-tip="Cabo USB: PC ↔ Arduino."/>
    <!-- Motor X wires -->
    <path class="w" data-g="mot" stroke="var(--c2)"  stroke-width="2.6" d="M873 290 H1000" data-tip="Motor X · 2B (bobina 2)"/>
    <path class="w" data-g="mot" stroke="var(--c2b)" stroke-width="2.6" d="M873 304 H1000" data-tip="Motor X · 2A (bobina 2)"/>
    <path class="w" data-g="mot" stroke="var(--c1b)" stroke-width="2.6" d="M873 318 H1000" data-tip="Motor X · 1A (bobina 1)"/>
    <path class="w" data-g="mot" stroke="var(--c1)"  stroke-width="2.6" d="M873 332 H1000" data-tip="Motor X · 1B (bobina 1)"/>
    <!-- Motor Y wires -->
    <path class="w" data-g="mot" stroke="var(--c2)"  stroke-width="2.6" d="M873 380 H1000" data-tip="Motor Y · 2B (bobina 2)"/>
    <path class="w" data-g="mot" stroke="var(--c2b)" stroke-width="2.6" d="M873 394 H1000" data-tip="Motor Y · 2A (bobina 2)"/>
    <path class="w" data-g="mot" stroke="var(--c1b)" stroke-width="2.6" d="M873 408 H1000" data-tip="Motor Y · 1A (bobina 1)"/>
    <path class="w" data-g="mot" stroke="var(--c1)"  stroke-width="2.6" d="M873 422 H1000" data-tip="Motor Y · 1B (bobina 1)"/>
    <!-- Endstops -->
    <path class="w" data-g="end" stroke="var(--end)" stroke-width="3" d="M656 565 V680" data-tip="Fim de curso X: NO → X+ pino BRANCO (D9)."/>
    <path class="w" data-g="end" stroke="var(--gnd)" stroke-width="3" d="M674 565 V680" data-tip="Fim de curso X: COM → X+ pino PRETO (GND)."/>
    <path class="w" data-g="end" stroke="var(--end)" stroke-width="3" d="M756 565 V680" data-tip="Fim de curso Y: NO → Y+ pino BRANCO (D10)."/>
    <path class="w" data-g="end" stroke="var(--gnd)" stroke-width="3" d="M774 565 V680" data-tip="Fim de curso Y: COM → Y+ pino PRETO (GND)."/>
    <!-- solder dots -->
    <g fill="#1d1d1f"><circle cx="656" cy="680" r="3"/><circle cx="674" cy="680" r="3"/><circle cx="756" cy="680" r="3"/><circle cx="774" cy="680" r="3"/><circle cx="856" cy="680" r="3"/><circle cx="900" cy="750" r="3"/><circle cx="940" cy="750" r="3"/></g>
  </svg>
